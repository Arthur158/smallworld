apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: game

spec:
  selector:
    app: redis

  ports:
    - name: redis
      port: 6379
      targetPort: redis

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: game

spec:
  serviceName: redis
  replicas: 1

  selector:
    matchLabels:
      app: redis

  template:
    metadata:
      labels:
        app: redis

    spec:
      # Make sure Redis runs on the node that has our host directory.
      nodeSelector:
        game-storage: "true"

      containers:
        - name: redis
          image: redis:8

          args:
            - redis-server
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --dir
            - /data

          ports:
            - name: redis
              containerPort: 6379

          volumeMounts:
            - name: redis-data
              mountPath: /data

          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 2
            periodSeconds: 5

          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10

      volumes:
        - name: redis-data
          hostPath:
            path: /var/local/game-data/redis
            type: DirectoryOrCreate
