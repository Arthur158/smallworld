apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: game

spec:
  type: NodePort

  selector:
    app: gateway

  ports:
    - name: http
      port: 8080
      targetPort: http

      # Must match the kind containerPort
      # from kind-config.yaml.
      nodePort: 30080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: game

spec:
  replicas: 3

  selector:
    matchLabels:
      app: gateway

  template:
    metadata:
      labels:
        app: gateway

    spec:
      terminationGracePeriodSeconds: 20

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - gateway
                topologyKey: kubernetes.io/hostname

      containers:
        - name: gateway

          image: smallworld-gateway:dev
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: LISTEN_ADDR
              value: ":8080"

            - name: REDIS_ADDR
              value: redis:6379

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: game-database
                  key: url

            # Must match room-worker count.
            - name: ROOM_WORKER_COUNT
              value: "2"

            # Each gateway automatically gets its Kubernetes Pod name:
            #
            # gateway-7b9fc8...
            # gateway-7b9fc8...
            #
            # Therefore every gateway has its own Redis direct-event channel.
            - name: GATEWAY_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            # Fine for LOCAL DEVELOPMENT.
            - name: WS_ALLOWED_ORIGINS
              value: "*"

          readinessProbe:
            httpGet:
              path: /readyz
              port: http

            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2

          livenessProbe:
            httpGet:
              path: /livez
              port: http

            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
