apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: game

spec:
  template:
    spec:
      restartPolicy: OnFailure

      containers:
        - name: migrate
          image: postgres:18

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: game-database
                  key: url

          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL..."

              until pg_isready \
                -h postgres \
                -U game \
                -d game
              do
                sleep 2
              done

              echo "Running database migration..."

              psql \
                "$DATABASE_URL" \
                -v ON_ERROR_STOP=1 \
                -f /migration/001_distributed_backend.sql

          volumeMounts:
            - name: migration
              mountPath: /migration

      volumes:
        - name: migration
          configMap:
            name: db-migration
